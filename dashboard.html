<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unfuck Leads Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
        }

        .stat-label {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
        }

        /* Filters */
        .filters {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input {
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #FF0000;
        }

        button {
            background: #FF0000;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background: #cc0000;
        }

        button.secondary {
            background: #333;
        }

        button.secondary:hover {
            background: #444;
        }

        /* Leads Table */
        .leads-container {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #0a0a0a;
            border-bottom: 1px solid #333;
        }

        th {
            padding: 15px;
            text-align: left;
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        td {
            padding: 15px;
            border-top: 1px solid #333;
            font-size: 14px;
        }

        tbody tr {
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: #222;
            cursor: pointer;
        }

        /* Status badges */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge.new { background: #FF0000; color: #fff; }
        .badge.contacted { background: #FFA500; color: #000; }
        .badge.qualified { background: #FFFF00; color: #000; }
        .badge.proposal_sent { background: #00BFFF; color: #000; }
        .badge.won { background: #00FF00; color: #000; }
        .badge.lost { background: #666; color: #fff; }

        /* Source badges */
        .badge.reviews { background: #9333EA; color: #fff; }
        .badge.web { background: #3B82F6; color: #fff; }
        .badge.ads { background: #EF4444; color: #fff; }
        .badge.copy { background: #10B981; color: #fff; }

        /* Priority badges */
        .badge.high { background: #FF0000; color: #fff; }
        .badge.medium { background: #FFA500; color: #000; }
        .badge.low { background: #666; color: #fff; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            padding: 40px;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .modal-content {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            max-width: 800px;
            width: 100%;
            padding: 30px;
            position: relative;
            margin: 20px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .modal-header h2 {
            font-size: 24px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 28px;
            cursor: pointer;
            padding: 0;
            width: 40px;
            height: 40px;
        }

        .close-btn:hover {
            color: #fff;
        }

        .modal-section {
            margin-bottom: 25px;
        }

        .modal-section h3 {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .info-item {
            background: #0a0a0a;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #333;
        }

        .info-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 14px;
            color: #fff;
            word-break: break-word;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        textarea {
            width: 100%;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            min-height: 100px;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #FF0000;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔥 Unfuck Leads Dashboard</h1>
            <p class="subtitle">Unified lead tracking for all Unfuck properties</p>
        </header>

        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-label">Total Leads</div>
                <div class="stat-value" id="statTotal">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Today</div>
                <div class="stat-value" id="statToday">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">This Week</div>
                <div class="stat-value" id="statWeek">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">New Leads</div>
                <div class="stat-value" id="statNew">0</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters">
            <div class="filter-group">
                <label>Source</label>
                <select id="filterSource">
                    <option value="">All Sources</option>
                    <option value="reviews">Reviews</option>
                    <option value="web">Web</option>
                    <option value="ads">Ads</option>
                    <option value="copy">Copy</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Status</label>
                <select id="filterStatus">
                    <option value="">All Statuses</option>
                    <option value="new">New</option>
                    <option value="contacted">Contacted</option>
                    <option value="qualified">Qualified</option>
                    <option value="proposal_sent">Proposal Sent</option>
                    <option value="won">Won</option>
                    <option value="lost">Lost</option>
                </select>
            </div>

            <div class="filter-group" style="align-self: flex-end;">
                <button onclick="applyFilters()">Apply Filters</button>
            </div>

            <div class="filter-group" style="align-self: flex-end;">
                <button class="secondary" onclick="resetFilters()">Reset</button>
            </div>

            <div class="filter-group" style="margin-left: auto; align-self: flex-end;">
                <button onclick="loadLeads()">Refresh</button>
            </div>
        </div>

        <!-- Leads Table -->
        <div class="leads-container">
            <table>
                <thead>
                    <tr>
                        <th>Source</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Status</th>
                        <th>Priority</th>
                        <th>Created</th>
                    </tr>
                </thead>
                <tbody id="leadsTableBody">
                    <tr>
                        <td colspan="7" class="loading">Loading leads...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Lead Detail Modal -->
    <div class="modal" id="leadModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Lead Details</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>

            <div id="modalBody">
                <!-- Will be populated dynamically -->
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE = 'https://leads.unfuckyourweb.com';

        let allLeads = [];
        let currentLead = null;

        // Load leads on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadLeads();
        });

        // Load dashboard stats
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/api/stats`);
                const data = await response.json();

                if (data.success) {
                    document.getElementById('statTotal').textContent = data.stats.total;
                    document.getElementById('statToday').textContent = data.stats.today;
                    document.getElementById('statWeek').textContent = data.stats.thisWeek;

                    const newCount = data.stats.byStatus.find(s => s.status === 'new')?.count || 0;
                    document.getElementById('statNew').textContent = newCount;
                }
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        // Load leads with optional filtering
        async function loadLeads(source = '', status = '') {
            const tbody = document.getElementById('leadsTableBody');
            tbody.innerHTML = '<tr><td colspan="7" class="loading">Loading leads...</td></tr>';

            try {
                let url = `${API_BASE}/api/leads?limit=100`;
                if (source) url += `&source=${source}`;
                if (status) url += `&status=${status}`;

                const response = await fetch(url);
                const data = await response.json();

                if (data.success) {
                    allLeads = data.leads;
                    renderLeads(allLeads);
                } else {
                    tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Failed to load leads</td></tr>';
                }
            } catch (error) {
                console.error('Failed to load leads:', error);
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Error loading leads</td></tr>';
            }
        }

        // Render leads in table
        function renderLeads(leads) {
            const tbody = document.getElementById('leadsTableBody');

            if (leads.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state"><h3>No leads yet</h3><p>Form submissions will appear here</p></td></tr>';
                return;
            }

            tbody.innerHTML = leads.map(lead => `
                <tr onclick="openLeadModal(${lead.id})">
                    <td><span class="badge ${lead.source}">${lead.source}</span></td>
                    <td>${lead.name}</td>
                    <td>${lead.email}</td>
                    <td>${lead.phone || '-'}</td>
                    <td><span class="badge ${lead.status}">${lead.status.replace('_', ' ')}</span></td>
                    <td><span class="badge ${lead.priority}">${lead.priority}</span></td>
                    <td>${formatDate(lead.created_at)}</td>
                </tr>
            `).join('');
        }

        // Open lead detail modal
        function openLeadModal(leadId) {
            const lead = allLeads.find(l => l.id === leadId);
            if (!lead) return;

            currentLead = lead;
            const modal = document.getElementById('leadModal');
            const modalBody = document.getElementById('modalBody');

            modalBody.innerHTML = `
                <div class="modal-section">
                    <h3>Contact Information</h3>
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Name</div>
                            <div class="info-value">${lead.name}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Email</div>
                            <div class="info-value"><a href="mailto:${lead.email}" style="color: #FF0000;">${lead.email}</a></div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Phone</div>
                            <div class="info-value">${lead.phone ? `<a href="tel:${lead.phone}" style="color: #FF0000;">${lead.phone}</a>` : '-'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Website</div>
                            <div class="info-value">${lead.website ? `<a href="${lead.website}" target="_blank" style="color: #FF0000;">${lead.website}</a>` : '-'}</div>
                        </div>
                    </div>
                </div>

                <div class="modal-section">
                    <h3>Lead Details</h3>
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Source</div>
                            <div class="info-value"><span class="badge ${lead.source}">${lead.source}</span></div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Created</div>
                            <div class="info-value">${formatDateLong(lead.created_at)}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Issues Count</div>
                            <div class="info-value">${lead.issues_count || 0}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">IP Address</div>
                            <div class="info-value">${lead.ip_address || '-'}</div>
                        </div>
                        ${lead.problem ? `
                        <div class="info-item full-width">
                            <div class="info-label">Problem Description</div>
                            <div class="info-value">${lead.problem}</div>
                        </div>
                        ` : ''}
                        ${lead.selected_issues ? `
                        <div class="info-item full-width">
                            <div class="info-label">Selected Issues</div>
                            <div class="info-value">${lead.selected_issues.split(' | ').join('<br>')}</div>
                        </div>
                        ` : ''}
                    </div>
                </div>

                ${lead.utm_source || lead.utm_campaign ? `
                <div class="modal-section">
                    <h3>Tracking</h3>
                    <div class="info-grid">
                        ${lead.utm_source ? `<div class="info-item"><div class="info-label">UTM Source</div><div class="info-value">${lead.utm_source}</div></div>` : ''}
                        ${lead.utm_medium ? `<div class="info-item"><div class="info-label">UTM Medium</div><div class="info-value">${lead.utm_medium}</div></div>` : ''}
                        ${lead.utm_campaign ? `<div class="info-item"><div class="info-label">UTM Campaign</div><div class="info-value">${lead.utm_campaign}</div></div>` : ''}
                        ${lead.referrer ? `<div class="info-item full-width"><div class="info-label">Referrer</div><div class="info-value">${lead.referrer}</div></div>` : ''}
                    </div>
                </div>
                ` : ''}

                <div class="modal-section">
                    <h3>Lead Management</h3>
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Status</div>
                            <select id="modalStatus" style="width: 100%; margin-top: 5px;">
                                <option value="new" ${lead.status === 'new' ? 'selected' : ''}>New</option>
                                <option value="contacted" ${lead.status === 'contacted' ? 'selected' : ''}>Contacted</option>
                                <option value="qualified" ${lead.status === 'qualified' ? 'selected' : ''}>Qualified</option>
                                <option value="proposal_sent" ${lead.status === 'proposal_sent' ? 'selected' : ''}>Proposal Sent</option>
                                <option value="won" ${lead.status === 'won' ? 'selected' : ''}>Won</option>
                                <option value="lost" ${lead.status === 'lost' ? 'selected' : ''}>Lost</option>
                            </select>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Priority</div>
                            <select id="modalPriority" style="width: 100%; margin-top: 5px;">
                                <option value="low" ${lead.priority === 'low' ? 'selected' : ''}>Low</option>
                                <option value="medium" ${lead.priority === 'medium' ? 'selected' : ''}>Medium</option>
                                <option value="high" ${lead.priority === 'high' ? 'selected' : ''}>High</option>
                            </select>
                        </div>
                        <div class="info-item full-width">
                            <div class="info-label">Notes</div>
                            <textarea id="modalNotes" style="margin-top: 5px;">${lead.notes || ''}</textarea>
                        </div>
                    </div>
                </div>

                <div class="modal-actions">
                    <button class="secondary" onclick="closeModal()">Cancel</button>
                    <button onclick="updateLead()">Save Changes</button>
                </div>
            `;

            modal.classList.add('active');
        }

        // Close modal
        function closeModal() {
            document.getElementById('leadModal').classList.remove('active');
            currentLead = null;
        }

        // Update lead
        async function updateLead() {
            if (!currentLead) return;

            const status = document.getElementById('modalStatus').value;
            const priority = document.getElementById('modalPriority').value;
            const notes = document.getElementById('modalNotes').value;

            try {
                const response = await fetch(`${API_BASE}/api/leads/update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: currentLead.id,
                        status,
                        priority,
                        notes
                    })
                });

                const data = await response.json();

                if (data.success) {
                    closeModal();
                    loadStats();
                    loadLeads();
                } else {
                    alert('Failed to update lead');
                }
            } catch (error) {
                console.error('Failed to update lead:', error);
                alert('Error updating lead');
            }
        }

        // Apply filters
        function applyFilters() {
            const source = document.getElementById('filterSource').value;
            const status = document.getElementById('filterStatus').value;
            loadLeads(source, status);
        }

        // Reset filters
        function resetFilters() {
            document.getElementById('filterSource').value = '';
            document.getElementById('filterStatus').value = '';
            loadLeads();
        }

        // Format date helpers
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function formatDateLong(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
        }

        // Close modal on background click
        document.getElementById('leadModal').addEventListener('click', (e) => {
            if (e.target.id === 'leadModal') closeModal();
        });

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
